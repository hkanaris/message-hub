name: Build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single exe
        run: >
          dotnet publish src/MessageHub/MessageHub.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true -o out

      - uses: actions/upload-artifact@v4
        with:
          name: MessageHub
          path: out/MessageHub.exe

      # Every push to main publishes a release named after <Version> in the .csproj.
      - name: Read version
        if: github.ref == 'refs/heads/main'
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/MessageHub/MessageHub.csproj)).Project.PropertyGroup.Version
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Message Hub ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: out/MessageHub.exe
